<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Responsible AI Gateway · Review workspace</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to review</a>
  <aside class="sidebar">
    <div class="brand"><span class="brand-icon" aria-hidden="true">G</span><span>Responsible AI<br><strong>Gateway</strong></span></div>
    <nav aria-label="Review sections">
      <a href="#main" aria-current="page">Review workspace</a>
      <a href="#assessment">Requirements</a>
      <a href="#decision">Reviewer decision</a>
    </nav>
    <details class="history">
      <summary>Review history</summary>
      <div id="history-list"></div>
    </details>
    <div class="sidebar-foot"><strong>NatWest hackathon</strong><span>Synthetic review workspace</span></div>
  </aside>
  <main id="main">
    <header class="topbar">
      <div><span class="topbar-light">Submissions</span><span class="slash" aria-hidden="true">/</span><strong id="submission-id">RAI-026</strong></div>
      <div class="controls">
        <label class="sr-only" for="revision">Submission revision</label>
        <select id="revision" disabled><option>Loading revisions…</option></select>
        <button class="primary" id="run-review" disabled>Run assessment</button>
      </div>
    </header>
    <div id="workspace" class="workspace" aria-live="polite"><p>Loading review workspace…</p></div>
  </main>
  <dialog id="evidence" aria-labelledby="evidence-title">
    <div class="drawer">
      <div class="drawer-top"><span id="evidence-kind" class="tag"></span><button class="close" type="button" aria-label="Close evidence">×</button></div>
      <h2 id="evidence-title"></h2>
      <p id="evidence-locator" class="muted"></p>
      <pre id="evidence-body"></pre>
    </div>
  </dialog>
</body>
</html>
